name: Core Invariants Validation Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate-kernel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout Code Distribution Base
      uses: actions/checkout@v4

    - name: Setup Target Python Environment Runtime
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Bootstrap Core System Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest pytest-asyncio

    - name: Execute PyTest System Invariant Validations
      run: |
        python -m pytest tests/ --asyncio-mode=strict
